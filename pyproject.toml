[tool.ruff]
target-version = "py311"  # Deck/Decky runtime floor
line-length = 100
extend-exclude = ["refs", "node_modules", "dist", "decky.pyi"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "W",   # pycodestyle warnings
    "B",   # bugbear
    "UP",  # pyupgrade
    "SIM", # simplify
]
ignore = [
    "E501",   # long lines in prompts/URLs are fine
    "SIM105", # try/except/pass is clearer than contextlib.suppress sometimes
]

[tool.ruff.lint.per-file-ignores]
# decky import only exists on the Deck
"main.py" = ["F401"]

[tool.pytest.ini_options]
testpaths = ["tests"]
